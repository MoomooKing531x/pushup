<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Rep Counter</title>
<style>
:root{--bg:#07090d;--fg:#fff;--accent:#39ff88;--warn:#ffb020;--glass:rgba(18,22,30,.55);--line:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090d;--fg:#fff}}
:root[data-theme="dark"]{--bg:#07090d;--fg:#fff}
*{-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#wrap{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
video{display:none}
#wrap:before,#wrap:after{content:"";position:absolute;left:0;right:0;pointer-events:none;z-index:1}
#wrap:before{top:0;height:42%;background:linear-gradient(#000a,#0000)}
#wrap:after{bottom:0;height:26%;background:linear-gradient(#0000,#000b)}
#top{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
#chip{font-size:15px;padding:9px 14px;border-radius:99px}
#meta{font-size:13px;font-weight:600;padding:9px 14px;border-radius:99px;opacity:.95}
#count{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 54px);left:0;right:0;text-align:center;font-weight:800;font-size:min(32vw,30vh);line-height:1;letter-spacing:-.04em;text-shadow:0 6px 30px rgba(0,0,0,.7);pointer-events:none;font-variant-numeric:tabular-nums}
#count.pop{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.12);color:var(--accent)}}
#status{position:absolute;z-index:2;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 54px + min(32vw,30vh) + 6px);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;font-size:clamp(14px,3vw,20px);font-weight:700;padding:8px 16px;border-radius:99px;pointer-events:none}
#bar{position:absolute;z-index:2;right:14px;top:38%;bottom:20%;width:12px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}
#fill{position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(var(--accent),#1fd1ff);transition:height .06s}
#dock{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:4px;padding:6px;border-radius:22px}
#dock button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 12px;min-width:58px;background:none;border-radius:16px}
#dock button i{font-style:normal;font-size:20px}
button{font:inherit;font-weight:700;color:var(--fg);border:0;cursor:pointer;background:rgba(255,255,255,.14)}
button:active{transform:scale(.96)}
button.primary{background:var(--accent);color:#000}
#start{position:absolute;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px 24px}
#start .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#start h1{margin:0;font-size:clamp(26px,5vw,38px);letter-spacing:-.02em}
#start p{margin:0;opacity:.7;line-height:1.5;font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.ex{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:18px;text-align:left;font-size:15px;border:2px solid transparent;background:rgba(255,255,255,.07)}
.ex i{font-style:normal;font-size:28px}.ex.on{border-color:var(--accent);background:rgba(57,255,136,.12)}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:12px}.seg button.on,.tabs button.on{background:var(--accent);color:#000}
.go{font-size:18px;padding:16px;border-radius:16px}
#hint{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07)}
#panel{position:absolute;inset:0;z-index:20;background:rgba(7,9,13,.97);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);display:none}
#panel .in{max-width:580px;margin:0 auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:9px 14px;border-radius:99px;font-size:14px}
select{font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12);color:var(--fg);border:0;margin-bottom:12px;width:100%}
select option{color:#000}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.card{background:rgba(255,255,255,.08);border-radius:16px;padding:12px}.card b{display:block;font-size:28px}.card span{opacity:.7;font-size:12px}
.row{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;margin-bottom:6px}
.row.me{outline:2px solid var(--accent)}.row .rk{width:28px;opacity:.6;font-weight:700}.row .n{font-size:26px;font-weight:800;width:56px}.row .d{flex:1;font-size:13px;opacity:.85}
h3{margin:16px 0 6px;font-size:14px;opacity:.85}svg{width:100%;height:auto;display:block}.muted{opacity:.6;font-size:13px}

#start{display:flex}
#start .in{margin:auto;width:100%;gap:12px}
#locker{position:relative;display:flex;align-items:center;gap:10px}
#stagebox{position:relative;flex:1;aspect-ratio:640/420;border-radius:28px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(70% 60% at 50% 45%,#16301f 0%,#0c1118 60%,#080a0f 100%)}
#stage{width:100%;height:100%;display:block}
#stage3{position:absolute;left:0;top:0;width:100%;height:100%;display:none;pointer-events:none}
.arrow{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;padding:0;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.arrow svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
#lname{text-align:center;font-size:clamp(26px,6vw,36px);font-weight:800;letter-spacing:-.02em}
#lcount{text-align:center;font-size:12px;opacity:.55;letter-spacing:.14em;margin-top:-6px}
#dots{display:flex;gap:6px;justify-content:center}#dots span{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.25);transition:.2s}#dots span.on{width:20px;background:var(--accent)}
#hint{text-align:center;background:none;padding:0 6px;min-height:40px;font-size:14px;opacity:.7}
#startStats{background:none;font-size:14px!important;opacity:.7}
.inr{animation:inr .28s}.inl{animation:inl .28s}
@keyframes inr{from{opacity:0;transform:translateX(40px)}}@keyframes inl{from{opacity:0;transform:translateX(-40px)}}
#dock button{flex-direction:row;font-size:13px;padding:10px 14px;min-width:0}
@media(max-width:560px){.arrow{position:absolute;top:50%;z-index:2;width:44px;height:44px;margin-top:-22px}#prev{left:8px}#next{right:8px}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas><video id="v" playsinline muted></video>
  <div id="top"><button id="chip" class="glass">Exercise</button><div id="meta" class="glass"></div></div>
  <div id="count">0</div>
  <div id="status" class="glass"></div>
  <div id="bar"><div id="fill"></div></div>
  <div id="dock" class="glass">
    <button id="bex">Exercise</button><button id="flip">Flip</button><button id="stats">Stats</button><button id="reset">Reset</button><button id="mute">Sound</button>
  </div>
  <div id="start"><div class="in">
    <h1 style="text-align:center;font-size:15px;opacity:.6;letter-spacing:.2em;text-transform:uppercase">Choose your workout</h1>
    
    <div id="locker">
      <button class="arrow" id="prev" aria-label="Previous exercise"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="stagebox"><canvas id="stage"></canvas><canvas id="stage3"></canvas></div>
      <button class="arrow" id="next" aria-label="Next exercise"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="lname"></div><div id="lcount"></div><div id="dots"></div>
    <div class="seg" id="seg"><button id="vs">Side view</button><button id="vf">Front view</button></div>
    <div id="hint"></div>
    <button class="primary go" id="go">Start camera</button>
    <button id="startStats" class="go" style="font-size:15px;padding:12px">My stats</button>
    <p id="err" style="color:var(--warn)"></p>
  </div></div>
  <div id="panel"><div class="in">
    <select id="fex"></select>
    <div class="tabs" id="tabs"></div>
    <div id="pbody"></div>
    <div class="tabs" style="margin-top:18px"><button id="pclose" class="on">Close</button><button id="pclear">Clear all data</button></div>
  </div></div>
</div>

function onResults(r){
  const W=cv.width,H=cv.height;
  ctx.drawImage(video,0,0,W,H);
  const L=r.poseLandmarks,WL=r.poseWorldLandmarks;
  if(!L){setStatus('Step back so your whole body is in view','var(--warn)');return;}
  const vis=i=>(L[i].visibility??0),now=performance.now();
  let v=null,lab=null;
  if(cfg.fn)v=cfg.fn(L,vis,W,H);
  else{
    const vals=[];
    cfg.tri.forEach(t=>{if(t.every(i=>vis(i)>.5)){vals.push(cfg.d3&&WL?ang3(WL[t[0]],WL[t[1]],WL[t[2]]):ang(L[t[0]],L[t[1]],L[t[2]],W,H));if(lab===null)lab=t[1];}});
    if(vals.length)v=cfg.agg==='min'?Math.min(...vals):vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  // posture gate
  let ok=true;const hipsVis=(vis(23)+vis(24))/2>.4;
  if(cfg.g==='plank'){
    if(!cfg.d3){
      const sh={x:(L[11].x+L[12].x)/2,y:(L[11].y+L[12].y)/2},hp={x:(L[23].x+L[24].x)/2,y:(L[23].y+L[24].y)/2};
      const an=(vis(27)+vis(28))/2>.4?{x:(L[27].x+L[28].x)/2,y:(L[27].y+L[28].y)/2}:hp;
      const bx=(an.x-sh.x)*W,by=(an.y-sh.y)*H;
      ok=hipsVis&&Math.abs(Math.atan2(by,Math.abs(bx)||1e-6))*180/Math.PI<38&&Math.hypot(bx,by)>H*.15;
    }else if(hipsVis&&WL){
      const dx=(WL[11].x+WL[12].x-WL[23].x-WL[24].x),dy=(WL[11].y+WL[12].y-WL[23].y-WL[24].y),dz=(WL[11].z+WL[12].z-WL[23].z-WL[24].z);
      ok=Math.abs(dy)/(Math.hypot(dx,dy,dz)||1)<.62;
    }else ok=vis(15)>.4&&vis(16)>.4&&(L[15].y+L[16].y)>(L[11].y+L[12].y);
  }else if(cfg.g==='hang')ok=vis(15)>.4&&vis(16)>.4&&(L[15].y+L[16].y)<(L[11].y+L[12].y);
  else if(cfg.g==='up')ok=(L[11].y+L[12].y)<(L[23].y+L[24].y);

  // skeleton
  ctx.lineCap='round';
  const working=stage==='work';
  BONES.forEach(([p,q])=>{
    if(vis(p)<.4||vis(q)<.4)return;
    const h=cfg.hlk.has(p+'-'+q)||cfg.hlk.has(q+'-'+p);
    ctx.strokeStyle=h?(working?'#ffb020':'#39ff88'):'rgba(255,255,255,.7)';
    ctx.lineWidth=h?Math.max(7,W/110):Math.max(4,W/200);
    ctx.beginPath();ctx.moveTo(L[p].x*W,L[p].y*H);ctx.lineTo(L[q].x*W,L[q].y*H);ctx.stroke();
  });
  [11,12,13,14,15,16,23,24,25,26,27,28].forEach(i=>{
    if(vis(i)<.4)return;
    ctx.fillStyle=i===lab?'#fff':'#39ff88';
    ctx.beginPath();ctx.arc(L[i].x*W,L[i].y*H,i===lab?W/85:W/150,0,7);ctx.fill();
  });

  if(v===null){setStatus('Can\u2019t see the key joints \u2014 adjust the camera','var(--warn)');return;}
  sm=sm===null?v:sm+cfg.k*(v-sm);

  if(lab!==null&&cfg.unit){
    const ex_=L[lab].x*W,ey=L[lab].y*H;
    ctx.save();
    if(facing==='user'){ctx.translate(ex_,ey);ctx.scale(-1,1);ctx.translate(-ex_,-ey);}
    ctx.font='bold '+Math.round(W/38)+'px sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;
    const t=Math.round(sm)+'\u00b0';ctx.strokeText(t,ex_+W/60,ey-W/60);ctx.fillText(t,ex_+W/60,ey-W/60);
    ctx.restore();
  }
  $('fill').style.height=((1-Math.max(0,Math.min(1,(sm-cfg.work)/(cfg.rest-cfg.work))))*100)+'%';

  if(!ok){
    if(now-lastOk>1200)stage=null;
    setStatus(cfg.gmsg,'var(--warn)');return;
  }
  lastOk=now;
  const d=Math.sign(cfg.rest-cfg.work);
  const isR=x=>d>0?x>cfg.rest:x<cfg.rest,isW=x=>d>0?x<cfg.work:x>cfg.work;
  if(stage===null){
    if(isR(sm)){stage='rest';upAt=now;}
    setStatus(cfg.start);
  }else if(stage==='rest'){
    setStatus(cfg.L1,'var(--accent)');
    if(isW(sm)){stage='work';downAt=now;ext=sm;beep(500);}
  }else{
    ext=d>0?Math.min(ext,sm):Math.max(ext,sm);
    setStatus(cfg.L2,'var(--warn)');
    if(isR(sm)){
      if(now-downAt>=cfg.min&&now-lastCount>cfg.min+50){
        count++;lastCount=now;const c=$('count');c.textContent=count;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
        beep(900);say(count);if(navigator.vibrate)navigator.vibrate(40);
        saveRep(ext,(now-upAt)/1000);meta();
      }
      stage='rest';upAt=now;
    }
  }
}

  const w=320,h=150,m=22,max=Math.max(1,...vals),bw=(w-10)/vals.length;let s='<svg viewBox="0 0 '+w+' '+h+'">';
  vals.forEach((v,i)=>{const bh=(h-m-16)*v/max,x=5+i*bw;
    s+='<rect x="'+(x+2)+'" y="'+(h-m-bh)+'" width="'+(bw-4)+'" height="'+Math.max(bh,v?2:0)+'" rx="3" fill="#39ff88"/>';
    if(v)s+='<text x="'+(x+bw/2)+'" y="'+(h-m-bh-4)+'" font-size="10" fill="#fff" text-anchor="middle">'+v+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="'+(h-6)+'" font-size="9" fill="#fff" opacity=".6" text-anchor="middle">'+labels[i]+'</text>';});
  return s+'</svg>';
}
function lineSvg(vals,unit,labs){
  if(!vals.length)return '<p class="muted">No data yet.</p>';
  const w=320,b=labs?14:0,h=130+b,p=22;let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<1){hi+=1;lo-=1;}
  const X=i=>p+(vals.length===1?(w-2*p)/2:i*(w-2*p)/(vals.length-1)),Y=v=>h-p-b-(v-lo)/(hi-lo)*(h-2*p-b);
  let s='<svg viewBox="0 0 '+w+' '+h+'"><polyline fill="none" stroke="#39ff88" stroke-width="2.5" points="'+vals.map((v,i)=>X(i)+','+Y(v)).join(' ')+'"/>';
  vals.forEach((v,i)=>{s+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3.5" fill="#fff"/>';
    if(labs)s+='<text x="'+X(i)+'" y="'+(h-4)+'" font-size="9" fill="#fff" opacity=".6" text-anchor="middle">'+labs[i]+'</text>';});
  return s+'<text x="4" y="12" font-size="10" fill="#fff" opacity=".6">'+Math.round(hi*10)/10+unit+'</text><text x="4" y="'+(h-p-b+12)+'" font-size="10" fill="#fff" opacity=".6">'+Math.round(lo*10)/10+unit+'</text></svg>';
}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const r1=v=>Math.round(v*10)/10;
const sodOf=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
const sowOf=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();};
const repsOf=l=>[].concat(...l.map(s=>s.reps||[]));
function bucket(list,keyFn,n){const o=Array.from({length:n},()=>[]);list.forEach(s=>{const k=keyFn(s);if(k>=0&&k<n)o[k].push(s);});return o;}
function bucketStats(bk,labs,hasDepth){
  const reps=bk.map(g=>g.reduce((a,s)=>a+s.n,0)),dep=[],dl=[],tm=[],tl=[];
  bk.forEach((g,i)=>{const r=repsOf(g);if(!r.length)return;tm.push(r1(avg(r.map(x=>x.s))));tl.push(labs[i]);if(hasDepth){dep.push(Math.round(avg(r.map(x=>x.d))));dl.push(labs[i]);}});
  return{reps,dep,dl,tm,tl};
}
function periodGraphs(tabk,list,E){
  const hasD=!!(E&&E.unit),chron=list.slice().sort((a,b)=>a.t-b.t);let h='';
  if(!chron.length)return '';
  if(tabk==='today'){
    const hrs=bucket(chron,s=>new Date(s.t).getHours(),24).map(g=>g.reduce((a,s)=>a+s.n,0));
    h+='<h3>Reps per hour</h3>'+barSvg(hrs,[...Array(24).keys()].map(i=>i%3?'':i));
    h+='<h3>Reps per session</h3>'+barSvg(chron.map(s=>s.n),chron.map(s=>new Date(s.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})));
    const r=repsOf(chron);
    if(hasD&&r.length)h+='<h3>Depth of every rep today (\u00b0)</h3>'+lineSvg(r.map(x=>x.d),'\u00b0');
    if(r.length)h+='<h3>Time per rep today (s)</h3>'+lineSvg(r.map(x=>x.s),'s');
  }else if(tabk==='week'){
    const labs=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const m=bucketStats(bucket(chron,s=>Math.round((sodOf(s.t)-sow())/864e5),7),labs,hasD);
    h+='<h3>Reps per day</h3>'+barSvg(m.reps,labs);
    if(hasD&&m.dep.length)h+='<h3>Average depth per day (\u00b0)</h3>'+lineSvg(m.dep,'\u00b0',m.dl);
    if(m.tm.length)h+='<h3>Average time per rep per day (s)</h3>'+lineSvg(m.tm,'s',m.tl);
  }else{
    const n=12,labs=[];
    for(let i=n-1;i>=0;i--){const d=new Date(sow());d.setDate(d.getDate()-7*i);labs.push(d.getDate()+'/'+(d.getMonth()+1));}
    const m=bucketStats(bucket(chron,s=>n-1-Math.round((sow()-sowOf(s.t))/(7*864e5)),n),labs,hasD);
    h+='<h3>Reps per week (last 12 weeks)</h3>'+barSvg(m.reps,labs);
    let c=0;const cum=chron.map(s=>c+=s.n);
    h+='<h3>Running total of reps</h3>'+lineSvg(cum,'');
    if(hasD&&m.dep.length)h+='<h3>Average depth per week (\u00b0)</h3>'+lineSvg(m.dep,'\u00b0',m.dl);
    if(m.tm.length)h+='<h3>Average time per rep per week (s)</h3>'+lineSvg(m.tm,'s',m.tl);
  }
  if(fex==='all'&&tabk!=='today'){
    h+='<h3>By exercise</h3>';
    ORDER.forEach(k=>{const t=chron.filter(s=>s.ex===k).reduce((a,s)=>a+s.n,0);if(t)h+='<div class="row"><div class="n">'+t+'</div><div class="d">'+EX[k].ic+' '+EX[k].n+'</div></div>';});
  }
  return h;
}
function render(){
  $('fex').innerHTML='<option value="all">All exercises</option>'+ORDER.map(k=>'<option value="'+k+'"'+(k===fex?' selected':'')+'>'+EX[k].ic+' '+EX[k].n+'</option>').join('');
  $('fex').value=fex;
  let tabsHtml=TABS.map(t=>'<button data-t="'+t[0]+'"'+(t[0]===tab?' class="on"':'')+'>'+t[1]+'</button>').join('');
  if(tab==='an'){
    const anOpts=[['today','Today'],['week','This week'],['all','All time']];
    tabsHtml+='<select id="antab" style="margin-left:12px;width:auto">'+anOpts.map(([v,l])=>'<option value="'+v+'"'+(v===anTab?' selected':'')+'>'+l+'</option>').join('')+'</select>';
  }
  $('tabs').innerHTML=tabsHtml;
  const all=sessions.filter(s=>s.n>0&&EX[s.ex]&&(fex==='all'||s.ex===fex)),b=$('pbody');
  if(tab!=='an'){
    const from=tab==='today'?sod():tab==='week'?sow():0;
    const list=all.filter(s=>s.t>=from).sort((x,y)=>y.n-x.n||y.t-x.t);
    const E=fex==='all'?null:EX[fex],rp=repsOf(list);
    let h='<div class="cards"><div class="card"><b>'+list.reduce((a,s)=>a+s.n,0)+'</b><span>total reps</span></div><div class="card"><b>'+(list[0]?list[0].n:0)+'</b><span>best session</span></div>'
      +'<div class="card"><b>'+list.length+'</b><span>sessions</span></div><div class="card"><b>'+(rp.length?r1(avg(rp.map(x=>x.s)))+'s':'-')+'</b><span>avg time per rep</span></div>'
      +(E&&E.unit?'<div class="card"><b>'+(rp.length?Math.round(avg(rp.map(x=>x.d)))+'\u00b0':'-')+'</b><span>avg depth</span></div>':'')+'</div>';
    if(!list.length)h+='<p class="muted">No sessions yet for this period.</p>';
    h+=periodGraphs(tab,list,E);
    h+='<h3>Top sessions</h3>';
    list.slice(0,10).forEach((s,i)=>{h+='<div class="row'+(s.id===cur.id?' me':'')+'"><div class="rk">#'+(i+1)+'</div><div class="n">'+s.n+'</div><div class="d">'+EX[s.ex].ic+' '+EX[s.ex].n+'<br>'+fmt(s.t)+(s.id===cur.id?' \u00b7 current':'')+'</div></div>';});
    b.innerHTML=h;
  }else{
    const from=anTab==='today'?sod():anTab==='week'?sow():0;
    const list=all.filter(s=>s.t>=from).sort((x,y)=>y.n-x.n||y.t-x.t);
    const E=fex==='all'?null:EX[fex],rp=repsOf(list);
    let h='<div class="cards"><div class="card"><b>'+list.reduce((a,s)=>a+s.n,0)+'</b><span>total reps</span></div><div class="card"><b>'+(list[0]?list[0].n:0)+'</b><span>best session</span></div>'
      +'<div class="card"><b>'+list.length+'</b><span>sessions</span></div><div class="card"><b>'+(rp.length?r1(avg(rp.map(x=>x.s)))+'s':'-')+'</b><span>avg time per rep</span></div>'
      +(E&&E.unit?'<div class="card"><b>'+(rp.length?Math.round(avg(rp.map(x=>x.d)))+'\u00b0':'-')+'</b><span>avg depth</span></div>':'')+'</div>';
    if(!list.length)h+='<p class="muted">No sessions yet for this period.</p>';
    h+=periodGraphs(anTab,list,E);
    const last=all.slice().sort((x,y)=>y.t-x.t)[0];
    if(last&&last.reps.length){
      const aT=Math.round(last.reps.reduce((a,r)=>a+r.s,0)/last.reps.length*10)/10;
      h+='<h3>Latest: '+EX[last.ex].ic+' '+EX[last.ex].n+', '+last.n+' reps ('+fmt(last.t)+')</h3><p class="muted">Average '+aT+' s per rep.'+(EX[last.ex].unit?' Average depth '+Math.round(last.reps.reduce((a,r)=>a+r.d,0)/last.reps.length)+'\u00b0.':'')+'</p>';
      if(EX[last.ex].unit)h+='<h3>Range of motion per rep (\u00b0)</h3>'+lineSvg(last.reps.map(r=>r.d),'\u00b0');
      h+='<h3>Time per rep (s)</h3>'+lineSvg(last.reps.map(r=>r.s),'s')+'<p class="muted">If reps slow down or get shallower toward the end, that is fatigue showing.</p>';
    }else h+='<p class="muted">Complete a session to see detailed rep graphs.</p>';
    b.innerHTML=h;
  }
}
function openPanel(){fex=running||true?ex:'all';render();$('panel').style.display='block';}
$('fex').onchange=e=>{fex=e.target.value;render();};
$('tabs').onclick=e=>{const t=e.target.dataset&&e.target.dataset.t;if(t){tab=t;render();}};
document.addEventListener('change',e=>{if(e.target.id==='antab'){anTab=e.target.value;render();}});
$('pclose').onclick=()=>{$('panel').style.display='none';};
$('pclear').onclick=()=>{if(confirm('Delete all saved workout history?')){sessions=[];persist();resetAll();render();}};

$('go').onclick=init;
$('stats').onclick=openPanel;$('startStats').onclick=openPanel;
$('chip').onclick=$('bex').onclick=()=>{$('start').style.display='flex';};
$('flip').onclick=async()=>{facing=facing==='user'?'environment':'user';try{await startCam();}catch(e){}};
$('reset').onclick=resetAll;
$('mute').onclick=()=>{sound=!sound;$('mute').textContent=sound?'Sound':'Muted';};
try{if('wakeLock' in navigator)$('go').addEventListener('click',()=>navigator.wakeLock.request('screen').catch(()=>{}));}catch(e){}
newSession();setEx(ex,true);
})();
</script>
